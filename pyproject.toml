[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gossipmesh"
version = "0.1.0"
description = "Network-coded gossip for amateur packet radio, with a simulator and a KISS TNC node"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Londopy" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]
keywords = ["ham-radio", "packet-radio", "ax25", "kiss", "network-coding", "mesh"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Ham Radio",
    "Typing :: Typed",
]

[project.optional-dependencies]
sign = ["cryptography>=50.0"]
serial = ["pyserial>=3.5"]
dev = ["pytest>=9.2", "hypothesis>=6.150", "ruff>=0.17", "mypy>=2.4", "types-pyserial>=3.5"]
all = ["gossipmesh[sign,serial]"]

[project.scripts]
gossipmesh = "gossipmesh._cli:main"

[project.urls]
Homepage = "https://github.com/Londopy/gossipmesh"
Repository = "https://github.com/Londopy/gossipmesh"
"Bug Tracker" = "https://github.com/Londopy/gossipmesh/issues"

[tool.hatch.build.targets.wheel]
packages = ["gossipmesh"]

[tool.hatch.build.targets.sdist]
# the package and its tests only; CI config is no use to someone installing from source
exclude = [".github/"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly rather than inherited: ruff's default selection grows over
# time, and an unpinned CI ruff could turn a green build red without a commit.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full simulator runs"]

[tool.mypy]
python_version = "3.10"
strict = true
